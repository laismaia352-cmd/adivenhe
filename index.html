<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinhe o numero</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Adivinhe o numero</h1>
        <P>Vamos jogar? Vou pensar em um numero até 100 e quero que você me ajude a adinhar. </P>
        <p>Fique esperto você só tem 05 chances</p>
    </header>

    <main>
        <div class="game-box">
            <button id="botaojogar">Vamos Jogar</button>

            <div class="area-chute">
                <label for="CHUTE">Seu chute:</label>
                <input type="number" id="CHUTE" min="1" max="100" placeholder="1 a 100" >
                <button id="botaochutar" >CHUTAR</button>
            </div>

            <p id="resultado" aria-live="polite">Clique em "Vamos Jogar" para começar.</p>

            <details>
                <summary>DICA</summary>
                <p id="dica">▶ DICA</p>
                
            </details>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
